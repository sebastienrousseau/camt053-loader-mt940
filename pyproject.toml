[project]
name = "camt053-loader-mt940"
version = "0.0.17"
description = "Convert legacy SWIFT MT940 bank statements to camt.053 ParsedDocument."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 OR MIT"
authors = [{ name = "Sebastien Rousseau", email = "sebastian.rousseau@gmail.com" }]
keywords = [
    "iso20022",
    "camt053",
    "mt940",
    "swift",
    "bank-statements",
    "loader",
    "fintech",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "camt053 >= 0.0.16, < 1",
]

[project.optional-dependencies]
dev = [
    "pytest >= 8",
    "pytest-cov >= 5",
    "ruff >= 0.6",
    "mypy >= 1.11",
    "interrogate >= 1.7",
    # tests/test_suite_conformance.py parses pyproject.toml. tomllib is
    # stdlib only from 3.11 and the suite floor is 3.10, so the backport is
    # needed there, or the conformance gate simply does not run on 3.10.
    'tomli >= 2 ; python_version < "3.11"',
    "packaging >= 23",
]

[project.urls]
Homepage = "https://github.com/sebastienrousseau/camt053-loader-mt940"
Documentation = "https://github.com/sebastienrousseau/camt053-loader-mt940#readme"
Repository = "https://github.com/sebastienrousseau/camt053-loader-mt940"
Issues = "https://github.com/sebastienrousseau/camt053-loader-mt940/issues"
"Parent project" = "https://github.com/sebastienrousseau/camt053"

[build-system]
requires = ["hatchling >= 1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["camt053_loader_mt940"]

[tool.ruff]
line-length = 80
# Generated and vendored from one canonical copy shared by all 32 repositories
# in the suite, and checksummed by its own test. The suite uses three different
# line lengths, so letting each repository's formatter rewrite it would make
# the checksum unsatisfiable everywhere. Excluded for the same reason any
# generated file is.
extend-exclude = ["tests/test_suite_conformance.py"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "N", "SIM"]

[tool.pytest.ini_options]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-q",
    "--cov=camt053_loader_mt940",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
    # Load/stress tests (marker ``perf``) are excluded from the
    # coverage-gated default run, mirroring the parent ``camt053``
    # suite. Select them explicitly with ``-m perf --no-cov``.
    "-m", "not perf",
]
markers = [
    "perf: load/stress and performance tests",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["camt053_loader_mt940"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError"]
show_missing = true

[tool.interrogate]
fail-under = 100
ignore-init-module = true
ignore-magic = true
verbose = 1

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = "camt053.*"
ignore_missing_imports = true
