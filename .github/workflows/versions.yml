# Every restatement of the release version agrees: pyproject, __version__,
# CHANGELOG, CITATION.cff, the release notes release.yml publishes, the
# README's latest-release callout and SECURITY.md's supported-versions
# table. Standard library only; no install.
name: Version sources agree

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python3 scripts/verify_versions.py
