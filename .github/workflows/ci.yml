name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # release.yml refuses to publish without releases/v<version>.md, but it
  # only finds out after a tag has been pushed — which is exactly how
  # v0.0.16 failed, on an already-public tag. Same check, moved to where
  # it costs a red PR instead of a bad tag.
  release-notes:
    name: Release Notes Present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every version must have release notes
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^version' pyproject.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          NOTE_PATH="releases/v${VERSION}.md"
          if [ ! -f "$NOTE_PATH" ]; then
            echo "::error::pyproject.toml declares ${VERSION} but ${NOTE_PATH} does not exist."
            echo "::error::release.yml requires it and will fail after the tag is pushed."
            exit 1
          fi
          echo "Found ${NOTE_PATH} for version ${VERSION}"

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # Hash-pinned install (OpenSSF Scorecard Pinned-Dependencies). The
      # package itself installs with --no-deps on top of the pinned tree.
      - name: Install dependencies (hash-pinned)
        run: |
          pip install --require-hashes -r requirements/test.txt
          pip install --no-deps -e .

      - name: Run tests with 100% coverage gate
        run: |
          python -m pytest tests/ \
            --cov=camt053_loader_mt940 --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=100

      - name: Enforce 100% docstring coverage
        run: interrogate -c pyproject.toml camt053_loader_mt940

      # The benchmark asserts no timing threshold -- wall-clock numbers are
      # not comparable between runners. This proves it still executes
      # against the current API, so it cannot rot into documentation that
      # reads as verified and is not.
      - name: Run the benchmark
        run: python benches/bench_parse_mt940.py --quick

      - name: Run examples end-to-end
        run: |
          for example in examples/*.py; do
            echo "--- $example ---"
            python "$example"
          done

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install lint tools (hash-pinned)
        run: pip install --require-hashes -r requirements/lint.txt

      - name: Ruff check
        run: ruff check camt053_loader_mt940/ tests/ examples/ benches/ scripts/ fuzz/

      - name: Ruff format check
        run: ruff format --check camt053_loader_mt940/ tests/ examples/ benches/ scripts/ fuzz/

      - name: Mypy
        run: mypy camt053_loader_mt940/ scripts/

      # Every file's copyright and licence (Apache-2.0 OR MIT) is
      # machine-readable: an SPDX header, or REUSE.toml for files that
      # cannot carry one.
      - name: REUSE compliance
        run: reuse lint

  # The native advisory audit, over the same hash-pinned tree the tests
  # install, so a published advisory against camt053 or anything it pulls
  # in fails the pull request rather than waiting for a Dependabot alert.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pip-audit (hash-pinned)
        run: pip install --require-hashes -r requirements/audit.txt

      - name: pip-audit
        run: |
          for f in requirements/*.txt; do
            echo "--- $f ---"
            pip-audit --progress-spinner off --require-hashes --disable-pip -r "$f"
          done

  # Per function: cyclomatic <= 10, cognitive <= 15, Halstead difficulty
  # <= 30, <= 60 lines; <= 500 lines per file. Offenders that predate the
  # gate live in complexity-baseline.json, which may only shrink; it is
  # empty today. tests/ is not measured: test_suite_conformance.py is
  # vendored from one canonical copy and checksummed, so it cannot be
  # edited here.
  complexity:
    name: Complexity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install radon and complexipy (hash-pinned)
        run: pip install --require-hashes -r requirements/complexity.txt

      - name: Complexity
        run: |
          python scripts/check_complexity.py
          complexipy camt053_loader_mt940 scripts benches examples fuzz --max-complexity-allowed 15 --quiet
