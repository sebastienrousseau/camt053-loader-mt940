# Licensing for files that cannot carry a comment header: generated
# lockfiles, the JSON complexity baseline, and the release notes, which
# release.yml publishes verbatim as the GitHub release body. Checked by
# `reuse lint` in CI.
version = 1

[[annotations]]
path = [
  "requirements/*.txt",
  "complexity-baseline.json",
  "releases/*.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-License-Identifier = "Apache-2.0 OR MIT"
