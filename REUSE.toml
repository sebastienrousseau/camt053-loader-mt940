# Licensing for files that cannot carry a comment header: generated
# lockfiles, the JSON complexity baseline, the demo GIF, and the release
# notes, which release.yml publishes verbatim as the GitHub release body.
# Checked by `reuse lint` in CI.
version = 1

[[annotations]]
path = [
  "requirements/*.txt",
  "complexity-baseline.json",
  "releases/*.md",
  ".github/demo.gif",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

# The Developer Certificate of Origin text is the Linux Foundation's,
# distributed verbatim under its own terms.
[[annotations]]
path = "DCO.txt"
precedence = "override"
SPDX-FileCopyrightText = "2004, 2006 The Linux Foundation and its contributors"
SPDX-License-Identifier = "LicenseRef-DCO"
